name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build & test Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ("$env:GITHUB_REF" -like "refs/tags/v*") {
              $ver = "$env:GITHUB_REF" -replace '^refs/tags/v',''
            } else {
              $ver = "1.0.0"
            }
          }
          $ver = $ver.TrimStart('v')
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Inno Setup 6 and Lua compiler are installed
        shell: pwsh
        run: |
          $iscc86 = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $iscc64 = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc86) -and -not (Test-Path $iscc64)) {
            choco install innosetup --no-progress -y
          }
          $luaDir = Join-Path $env:RUNNER_TEMP 'lua52'
          New-Item -ItemType Directory -Force -Path $luaDir | Out-Null
          choco install lua --no-progress -y
          $luacExe = Get-ChildItem -Path 'C:\ProgramData\chocolatey','C:\Program Files (x86)\Lua','C:\Program Files\Lua' -Filter 'luac*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          Copy-Item $luacExe.FullName (Join-Path $luaDir 'luac.exe') -Force
          "$luaDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $luaDir 'luac.exe') -v

      - name: Bootstrap compiler, run tests, and build Windows installer (.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Run-Logged([string]$Label, [scriptblock]$Block) {
            $out = & $Block 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0) {
              $lines = ($out -split "`r?`n") | Select-Object -Last 60
              $msg = (($lines -join "`n") -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
              Write-Output "::error::Windows step failed ($Label):%0A$msg"
              exit $code
            }
          }
          Run-Logged "bootstrap" { cmd /c "factorio-mod.cmd bootstrap" }
          Run-Logged "Generator.Tests" { dotnet test tests\Generator.Tests -c Release --nologo }
          Run-Logged "Transpile.Tests" { dotnet test tests\Transpile.Tests -c Release --nologo }
          Run-Logged "Analyzer.Tests" { dotnet test tests\Analyzer.Tests -c Release --nologo }
          Run-Logged "installer/build.cmd" { cmd /c "installer\build.cmd ${{ steps.meta.outputs.version }}" }

      - name: Smoke-test Windows dist and installer (.exe)
        shell: pwsh
        run: |
          try {
            $ver = "${{ steps.meta.outputs.version }}"
            $distPath = (Resolve-Path "dist").Path
            $installer = Resolve-Path "release\FactorioCSharpModder-$ver-win64.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "FactorioCSharpModderInstall"
            $smokeDir = Join-Path $env:RUNNER_TEMP "FactorioSmoke"
            New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null

            Push-Location $smokeDir
            try {
              & "$distPath\bin\factorio-mod.exe" doctor
              if ($LASTEXITCODE -ne 0) { throw "dist doctor failed ($LASTEXITCODE)" }
              & "$distPath\bin\factorio-mod.exe" build "$distPath\mods\HelloFactorio"
              if ($LASTEXITCODE -ne 0) { throw "dist build HelloFactorio failed ($LASTEXITCODE)" }
            } finally {
              Pop-Location
            }

            $proc = Start-Process -FilePath $installer.Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TEMPLATE', "/DIR=$installDir") -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }

            $exe = Join-Path $installDir 'bin\factorio-mod.exe'
            Push-Location $smokeDir
            try {
              & $exe --version
              if ($LASTEXITCODE -ne 0) { throw "factorio-mod --version failed" }
              & $exe doctor
              if ($LASTEXITCODE -ne 0) { throw "factorio-mod doctor failed" }
              & $exe new SmokeTest
              if ($LASTEXITCODE -ne 0) { throw "factorio-mod new SmokeTest failed" }
            } finally {
              Pop-Location
            }
            dotnet new list factorio-mod
          } catch {
            $msg = $_.Exception.ToString() -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error::Windows smoke test failed:%0A$msg"
            throw
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "v$ver"
          $exe = "release\FactorioCSharpModder-$ver-win64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target "${env:GITHUB_SHA}" --title "Factorio C# Modder $ver" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
