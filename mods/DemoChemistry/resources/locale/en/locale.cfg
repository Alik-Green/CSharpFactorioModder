; English strings that are not a prototype's own name.
;
; The names and descriptions themselves are written in data/*.cs as LocalisedName /
; LocalisedDescription, and `factorio-mod build` merges them into this file, so a name cannot drift
; apart from the prototype it belongs to. Anything written here by hand is kept as it is - other
; languages, and strings a prototype does not own.
;
; (This file has no entries of its own at the moment: every English string this mod needs is a
; prototype's name or description.)
